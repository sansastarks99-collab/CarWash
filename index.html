<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasir Carwash & Cafe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1b1f27;--m:#6b7280;--p:#2563eb;--b:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--c:#1c1f27;--t:#e8eaf0;--m:#9aa1b0;--p:#4f8bff;--b:#2c303b}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--b)}
.tabs button.on,nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
.who{margin-left:auto;color:var(--m);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
button,input,select{font:inherit;padding:8px 12px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
button{cursor:pointer}button.p{background:var(--p);color:#fff;border-color:var(--p)}button.x{color:#dc2626}
main{padding:0 16px 40px;max-width:1100px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.k{font-size:12px;color:var(--m)}.v{font-size:20px;font-weight:600}
.pr{text-align:left}.pos{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:760px){.pos{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--b);text-align:left}
.login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
</style></head><body><div id="app"></div>
<script>
const SB_URL='https://nashdxgxdmyeylismlfp.supabase.co', SB_KEY='sb_publishable_pmmXEpXNpB2TzMGWtW1Fmg_7hp0rKY6';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), val=id=>$('#'+id).value;
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const err=e=>{if(e){alert(e.message);return true}};
const norm=s=>(s||'').toUpperCase().replace(/\s+/g,'');
const NAV=[['kasir','Kasir'],['menu','Menu'],['belanja','Belanja'],['riwayat','Riwayat'],['laporan','Laporan'],['diskon','Diskon'],['member','Member'],['staff','Staff'],['auth','Authorization']];
let me,unit='carwash',page='kasir',cart=[],member=null,P=[],D=[];
const mgr=()=>me.role==='manager', sell=()=>me.role!=='pemegang_saham';
const PAGES={};

async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const{data}=await sb.from('staff').select('*').eq('id',session.user.id).maybeSingle();
  if(!data){await sb.auth.signOut();alert('Akun belum terdaftar sebagai staff.');return loginView()}
  me=data;shell();
}
function loginView(){$('#app').innerHTML=`<div class="card login"><h2>🚗☕ Login Kasir</h2><input id=em type=email placeholder=Email><input id=pw type=password placeholder=Password><button class=p onclick=login()>Masuk</button></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:val('em'),password:val('pw')});if(!err(error))boot()}
sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')loginView()});

function shell(){
  $('#app').innerHTML=`<header><b>Kasir</b><div class=tabs>${['carwash','cafe'].map(u=>`<button class="${u==unit?'on':''}" onclick="setUnit('${u}')">${u=='carwash'?'🚗 Carwash':'☕ Cafe'}</button>`).join('')}</div><span class=who>${esc(me.name)} · ${me.role.replace('_',' ')} <button onclick="sb.auth.signOut()">Keluar</button></span></header><nav>${NAV.filter(n=>n[0]!='kasir'||sell()).map(n=>`<button id=n-${n[0]} onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><main id=main></main>`;
  go(sell()?page:'laporan');
}
function setUnit(u){unit=u;shell()}
async function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n-'+p));$('#main').innerHTML='Memuat...';await PAGES[p]()}

/* ---------- KASIR ---------- */
PAGES.kasir=async()=>{
  const[p,d]=await Promise.all([sb.from('products').select('*').eq('unit',unit).eq('active',true).order('name'),sb.from('discounts').select('*').eq('active',true)]);
  P=p.data||[];D=d.data||[];cart=[];member=null;
  $('#main').innerHTML=`<div class=pos><div class=grid>${P.map(x=>`<button class=pr onclick="add(${x.id})"><b>${esc(x.name)}</b><div class=k>${rp(x.price)}</div></button>`).join('')||'<p class=k>Belum ada menu. Tambah di tab Menu.</p>'}</div>
  <div class=card><div class=bar><input id=plat placeholder="Plat nomor (member)" style="flex:1"><button onclick=cariMember()>Cek</button></div><div id=mInfo class=k></div><div id=cart></div>
  <select id=bayar style="width:100%;margin:10px 0"><option value=tunai>Tunai</option><option value=qris>QRIS</option></select><button class=p style="width:100%" onclick=bayar()>Bayar</button></div></div>`;
  drawCart();
};
function add(id){const p=P.find(x=>x.id==id),i=cart.find(x=>x.id==id);i?i.qty++:cart.push({id,name:p.name,price:+p.price,cost:+p.cost,qty:1});drawCart()}
function qty(id,d){const i=cart.find(x=>x.id==id);i.qty+=d;if(i.qty<1)cart=cart.filter(x=>x!=i);drawCart()}
function calc(){const sub=cart.reduce((a,i)=>a+i.price*i.qty,0);
  const ds=D.filter(x=>(x.unit=='all'||x.unit==unit)&&(x.kind=='umum'||(member&&x.kind=='member_'+member.type)));
  const pct=Math.min(100,ds.reduce((a,x)=>a+Number(x.percent),0));const disc=Math.round(sub*pct/100);return{sub,ds,disc,total:sub-disc}}
function drawCart(){const c=calc();$('#cart').innerHTML=`<table>${cart.map(i=>`<tr><td>${esc(i.name)}</td><td><button onclick="qty(${i.id},-1)">−</button> ${i.qty} <button onclick="qty(${i.id},1)">+</button></td><td>${rp(i.price*i.qty)}</td></tr>`).join('')}</table>
  <p class=k>Subtotal ${rp(c.sub)}</p>${c.ds.map(x=>`<p class=k>Diskon ${esc(x.name)} ${x.percent}%</p>`).join('')}<div class=v>Total ${rp(c.total)}</div>`}
async function cariMember(){const pl=norm(val('plat'));if(!pl){member=null;$('#mInfo').textContent='';return drawCart()}
  const{data}=await sb.from('members').select('*').eq('plate',pl).maybeSingle();member=data;
  $('#mInfo').textContent=data?`✓ Member ${data.type}: ${data.name}`:'Plat belum terdaftar sebagai member';drawCart()}
async function bayar(){if(!cart.length)return;const c=calc();
  const{data:s,error}=await sb.from('sales').insert({unit,staff_id:me.id,member_id:member?.id||null,plate:member?.plate||norm(val('plat'))||null,subtotal:c.sub,discount:c.disc,total:c.total,payment:val('bayar')}).select().single();
  if(err(error))return;
  const r=await sb.from('sale_items').insert(cart.map(i=>({sale_id:s.id,name:i.name,price:i.price,cost:i.cost,qty:i.qty})));
  if(err(r.error))return;alert('Tersimpan: '+rp(c.total));PAGES.kasir()}

/* ---------- MENU ---------- */
PAGES.menu=async()=>{const{data=[]}=await sb.from('products').select('*').eq('unit',unit).order('name');
  $('#main').innerHTML=(mgr()?`<div class="card bar"><input id=pn placeholder="Nama menu"><input id=pp type=number placeholder="Harga jual"><input id=pc type=number placeholder="Modal/HPP"><button class=p onclick=addMenu()>Tambah</button></div>`:'')+
  `<div class=card><table><tr><th>Menu (${unit})<th>Harga<th>HPP<th></tr>${data.map(x=>`<tr style="opacity:${x.active?1:.5}"><td>${esc(x.name)}<td>${rp(x.price)}<td>${rp(x.cost)}<td>${mgr()?`<button onclick="editMenu(${x.id},${x.price},${x.cost})">Ubah</button> <button onclick="tog('products',${x.id},${!x.active})">${x.active?'Nonaktif':'Aktif'}</button> <button class=x onclick="del('products',${x.id})">Hapus</button>`:''}</tr>`).join('')}</table></div>`};
async function addMenu(){if(!val('pn')||!val('pp'))return;if(!err((await sb.from('products').insert({unit,name:val('pn'),price:+val('pp'),cost:+val('pc')||0})).error))go('menu')}
async function editMenu(id,p,c){const price=prompt('Harga jual',p);if(price===null)return;const cost=prompt('HPP',c);if(cost===null)return;if(!err((await sb.from('products').update({price:+price,cost:+cost}).eq('id',id)).error))go('menu')}
async function tog(t,id,a){if(!err((await sb.from(t).update({active:a}).eq('id',id)).error))go(page)}
async function del(t,id){if(confirm('Hapus?')&&!err((await sb.from(t).delete().eq('id',id)).error))go(page)}

/* ---------- BELANJA ---------- */
PAGES.belanja=async()=>{const t=new Date();t.setHours(0,0,0,0);
  const{data=[]}=await sb.from('expenses').select('*').gte('created_at',t.toISOString()).order('created_at',{ascending:false});
  $('#main').innerHTML=(sell()?`<div class="card bar"><select id=eu><option value=carwash ${unit=='carwash'?'selected':''}>Carwash</option><option value=cafe ${unit=='cafe'?'selected':''}>Cafe</option></select><select id=em2><option value=tunai>Tunai</option><option value=qris>QRIS</option></select><input id=ea type=number placeholder=Jumlah><input id=en placeholder=Keterangan style="flex:1"><button class=p onclick=addExp()>Simpan</button></div>`:'')+
  `<div class=card><b>Belanja hari ini</b><table>${data.map(x=>`<tr><td>${x.unit}<td>${x.method}<td>${esc(x.note)}<td>${rp(x.amount)}<td>${mgr()?`<button class=x onclick="del('expenses',${x.id})">Hapus</button>`:''}</tr>`).join('')}</table></div>`};
async function addExp(){if(!val('ea'))return;if(!err((await sb.from('expenses').insert({unit:val('eu'),method:val('em2'),amount:+val('ea'),note:val('en'),staff_id:me.id})).error))go('belanja')}

/* ---------- RIWAYAT ---------- */
PAGES.riwayat=async()=>{const t=new Date();t.setHours(0,0,0,0);
  const{data=[]}=await sb.from('sales').select('*,sale_items(*),staff(name)').eq('unit',unit).gte('created_at',t.toISOString()).order('created_at',{ascending:false});
  $('#main').innerHTML=`<div class=card><b>Penjualan hari ini (${unit}): ${data.length} transaksi · ${rp(data.reduce((a,x)=>a+ +x.total,0))}</b><table>${data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}<td>${x.sale_items.map(i=>esc(i.name)+' x'+i.qty).join(', ')}${x.plate?`<div class=k>${esc(x.plate)}</div>`:''}<td>${x.payment}<td>${esc(x.staff?.name)}<td>${rp(x.total)}</tr>`).join('')}</table></div>`};

/* ---------- LAPORAN ---------- */
const D0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function range(k){const n=new Date(),t=D0(n),day=864e5,y=n.getFullYear(),m=n.getMonth();
  if(k=='today')return[t,new Date(+t+day)];if(k=='yest')return[new Date(+t-day),t];
  if(k=='month')return[new Date(y,m,1),new Date(y,m+1,1)];if(k=='last')return[new Date(y,m-1,1),new Date(y,m,1)];
  return[D0(val('from')),new Date(+D0(val('to'))+day)]}
PAGES.laporan=async()=>{const td=new Date().toISOString().slice(0,10);
  $('#main').innerHTML=`<div class="card bar"><select id=rk onchange=lap()><option value=today>Hari ini<option value=yest>Kemarin<option value=month>Bulan ini<option value=last>Bulan lalu<option value=custom>Range tanggal</select><input type=date id=from value=${td}><input type=date id=to value=${td}><select id=ru onchange=lap()><option value=all>Semua unit<option value=carwash>Carwash<option value=cafe>Cafe</select><button class=p onclick=lap()>Tampilkan</button></div><div id=rep></div>`;lap()};
const sum=(a,f)=>a.reduce((s,x)=>s+ +f(x),0);
async function lap(){const[a,b]=range(val('rk')),u=val('ru');
  let q1=sb.from('sales').select('*,sale_items(*)').gte('created_at',a.toISOString()).lt('created_at',b.toISOString()).limit(5000),q2=sb.from('expenses').select('*').gte('created_at',a.toISOString()).lt('created_at',b.toISOString()).limit(5000);
  if(u!='all'){q1=q1.eq('unit',u);q2=q2.eq('unit',u)}
  const[{data:S=[]},{data:E=[]}]=await Promise.all([q1,q2]);
  const omzet=sum(S,x=>x.total),belanja=sum(E,x=>x.amount),items=S.flatMap(x=>x.sale_items),hpp=sum(items,i=>i.cost*i.qty);
  const top={};items.forEach(i=>{top[i.name]=(top[i.name]||0)+i.qty});
  const by=(arr,k,f)=>{const o={};arr.forEach(x=>o[x[k]]=(o[x[k]]||0)+ +f(x));return o};
  const rows=o=>Object.entries(o).map(([k,v])=>`<tr><td>${esc(k)}<td>${typeof v=='number'&&v>1e3?rp(v):v}</tr>`).join('');
  const day=by(S.map(x=>({...x,d:x.created_at.slice(0,10)})),'d',x=>x.total);
  $('#rep').innerHTML=`<div class=grid>${[['Omzet',rp(omzet)],['Total belanja',rp(belanja)],['Laba (omzet − belanja)',rp(omzet-belanja)],['Laba kotor (omzet − HPP)',rp(omzet-hpp)],['Total diskon',rp(sum(S,x=>x.discount))],['Transaksi',S.length],['Rata-rata/transaksi',rp(S.length?omzet/S.length:0)],['Dari member',S.filter(x=>x.member_id).length]].map(([k,v])=>`<div class=card><div class=k>${k}</div><div class=v>${v}</div></div>`).join('')}</div>
  <div class=grid style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><div class=card><b>Omzet per unit</b><table>${rows(by(S,'unit',x=>x.total))}</table></div><div class=card><b>Omzet per pembayaran</b><table>${rows(by(S,'payment',x=>x.total))}</table></div><div class=card><b>Belanja per metode</b><table>${rows(by(E,'method',x=>x.amount))}</table></div><div class=card><b>Menu terlaris (qty)</b><table>${rows(Object.fromEntries(Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,8)))}</table></div><div class=card><b>Omzet per hari</b><table>${rows(day)}</table></div></div>`}

/* ---------- DISKON ---------- */
PAGES.diskon=async()=>{const{data=[]}=await sb.from('discounts').select('*').order('id');
  $('#main').innerHTML=(mgr()?`<div class="card bar"><input id=dn placeholder="Nama diskon"><input id=dp type=number placeholder="%" style="width:80px"><select id=dk><option value=umum>Semua transaksi<option value=member_club>Member Club<option value=member_customer>Member Customer</select><select id=du><option value=all>Semua unit<option value=carwash>Carwash<option value=cafe>Cafe</select><button class=p onclick=addDisc()>Tambah</button></div>`:'')+
  `<div class=card><p class=k>Diskon aktif otomatis diterapkan di setiap transaksi (diskon member hanya jika plat member dipilih). Jika ada beberapa, persentasenya dijumlahkan.</p><table>${data.map(x=>`<tr style="opacity:${x.active?1:.5}"><td>${esc(x.name)}<td>${x.percent}%<td>${x.kind}<td>${x.unit}<td>${mgr()?`<button onclick="tog('discounts',${x.id},${!x.active})">${x.active?'Nonaktif':'Aktif'}</button> <button class=x onclick="del('discounts',${x.id})">Hapus</button>`:''}</tr>`).join('')}</table></div>`};
async function addDisc(){if(!val('dn')||!val('dp'))return;if(!err((await sb.from('discounts').insert({name:val('dn'),percent:+val('dp'),kind:val('dk'),unit:val('du')})).error))go('diskon')}

/* ---------- MEMBER ---------- */
PAGES.member=async()=>{const{data=[]}=await sb.from('members').select('*').order('plate');
  $('#main').innerHTML=(mgr()?`<div class="card bar"><input id=mp placeholder="Plat nomor"><input id=mn placeholder="Nama"><select id=mt><option value=club>Member Club<option value=customer>Member Customer</select><button class=p onclick=addMember()>Tambah</button></div>`:'')+
  `<div class=card><table>${data.map(x=>`<tr><td>${esc(x.plate)}<td>${esc(x.name)}<td>${x.type}<td>${mgr()?`<button class=x onclick="del('members',${x.id})">Hapus</button>`:''}</tr>`).join('')}</table></div>`};
async function addMember(){if(!val('mp')||!val('mn'))return;if(!err((await sb.from('members').insert({plate:norm(val('mp')),name:val('mn'),type:val('mt')})).error))go('member')}

/* ---------- STAFF & AUTHORIZATION ---------- */
const staffPage=roles=>async()=>{const{data=[]}=await sb.from('staff').select('*').in('role',roles).order('name');
  $('#main').innerHTML=(mgr()?`<div class="card bar"><input id=sn placeholder=Nama><input id=se type=email placeholder=Email><input id=sp type=password placeholder="Password (min 6)"><select id=sr>${roles.map(r=>`<option value=${r}>${r.replace('_',' ')}`).join('')}</select><button class=p onclick=addStaff()>Tambah</button></div>`:'')+
  `<div class=card><table>${data.map(x=>`<tr><td>${esc(x.name)}<td>${esc(x.email)}<td>${x.role}<td>${mgr()&&x.id!=me.id?`<button class=x onclick="del('staff','${x.id}')">Cabut akses</button>`:''}</tr>`).join('')}</table></div>`};
PAGES.staff=staffPage(['manager','kasir']);PAGES.auth=staffPage(['pemegang_saham']);
async function addStaff(){if(!val('se')||val('sp').length<6)return alert('Email & password (min 6) wajib');
  const tmp=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const{data,error}=await tmp.auth.signUp({email:val('se'),password:val('sp')});if(err(error))return;
  if(!err((await sb.from('staff').insert({id:data.user.id,name:val('sn'),email:val('se'),role:val('sr')})).error))go(page)}

boot();
</script></body></html>
